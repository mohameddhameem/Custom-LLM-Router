# Free Colab T4 (16 GB, no bfloat16) with vLLM. Run each run-experts stage as its own command
# so only one model is on the GPU. If vLLM fails to start on the T4, use t4-hf.toml.
[scorer]
# Public MS MARCO reranker as a stand-in for nano-jev.
kind = "reranker"
path = "cross-encoder/ms-marco-MiniLM-L6-v2"

[[experts]]
name = "small"
kind = "vllm"
model = "Qwen/Qwen2.5-1.5B-Instruct"
top_k = 2
dtype = "float16"
max_model_len = 4096

[[experts]]
name = "large"
kind = "vllm"
model = "Qwen/Qwen2.5-7B-Instruct-AWQ"  # official 4-bit weights; 16-bit 7B does not fit
quantization = "awq"
dtype = "float16"
max_model_len = 8192
