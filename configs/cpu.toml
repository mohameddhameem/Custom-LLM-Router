# Real models small enough for a CPU. Use --limit 20-50; expect a few seconds per question.
[scorer]
# Public MS MARCO reranker as a stand-in for nano-jev; lexical scoring is near-useless here
# because HotpotQA chose its distractors by word overlap with the question.
kind = "reranker"
path = "cross-encoder/ms-marco-MiniLM-L6-v2"

[[experts]]
name = "small"
kind = "hf"
model = "Qwen/Qwen2.5-0.5B-Instruct"
top_k = 2
dtype = "float32"

[[experts]]
name = "large"
kind = "hf"
model = "Qwen/Qwen2.5-1.5B-Instruct"
dtype = "float32"
# no top_k: reads all ten paragraphs
