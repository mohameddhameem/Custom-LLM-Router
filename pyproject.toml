[project]
name = "groupproject"
version = "0.1.0"
description = "Cost-aware routing between QA models on HotpotQA"
readme = "README.md"
authors = [
    { name = "Mohamed Dhameem", email = "mohamed_dhameem20@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
prepare-hotpotqa = "groupproject.prepare_hotpotqa:main"
make-splits = "groupproject.make_splits:main"
run-experts = "groupproject.run_experts:main"
train-router = "groupproject.router:main"
eval-routing = "groupproject.evaluate_routing:main"

[project.optional-dependencies]
llm = [
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
